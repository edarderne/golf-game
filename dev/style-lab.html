<!doctype html>
<!-- Style lab: renders ONE hole with experimental visual upgrades layered
     over the normal renderer (see style-lab.js). The live game is untouched
     until a look is approved and ported into js/render.js. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf — style lab</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Avenir Next', system-ui, sans-serif; }
    #course { position: fixed; inset: 0; width: 100%; height: 100%; }
    #bar {
      position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 5;
    }
    button {
      border: none; border-radius: 10px; padding: 8px 14px; font: inherit;
      font-weight: 700; background: rgba(253,248,236,0.95); cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <canvas id="course"></canvas>
  <div id="bar">
    <button id="btn-view">View: overview</button>
    <button id="btn-seed">New hole</button>
    <button id="btn-style">Style: NEW</button>
  </div>
  <script src="../js/rng.js"></script>
  <script src="../js/course.js"></script>
  <script src="../js/render.js"></script>
  <script src="style-lab.js"></script>
</body>
</html>
