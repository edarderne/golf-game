<!doctype html>
<!-- Dev-only: hunts seeds for one hole of each signature hazard (carry /
     narrow / guard / none) and renders it with the production renderer so
     the in-flight hazard feature can be eyeballed. Not linked from the game. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf — hazard test</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Avenir Next', system-ui, sans-serif; }
    #course { position: fixed; inset: 0; width: 100%; height: 100%; }
    #bar { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 5; flex-wrap: wrap; }
    button {
      border: none; border-radius: 10px; padding: 8px 14px; font: inherit;
      font-weight: 700; background: rgba(253,248,236,0.95); cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    button.active { background: #ffd24a; }
    #label {
      position: fixed; bottom: 12px; left: 12px; z-index: 5;
      background: rgba(0,0,0,0.6); color: #fff; padding: 6px 12px;
      border-radius: 8px; font-weight: 700; font-size: 15px;
    }
  </style>
</head>
<body>
  <canvas id="course"></canvas>
  <div id="bar"></div>
  <div id="label"></div>
  <script src="../js/rng.js?v=6"></script>
  <script src="../js/course.js?v=6"></script>
  <script src="../js/physics.js?v=6"></script>
  <script src="../js/ambient.js?v=6"></script>
  <script src="../js/render.js?v=6"></script>
  <script>
  (function () {
    'use strict';
    var canvas = document.getElementById('course');
    var renderer = new Renderer(canvas);
    var view = 'overview';

    // Hunt seeds for one hole of each feature. generateHole tags hole.feature.
    var WANT = ['carry', 'narrow', 'guard', 'lake', 'none'];
    var found = {};
    var seed = 1;
    while (Object.keys(found).length < WANT.length && seed < 4000) {
      var holes = Course.generate(seed, 9);
      for (var i = 0; i < holes.length; i++) {
        var f = holes[i].feature;
        if (WANT.indexOf(f) >= 0 && !found[f]) {
          found[f] = { hole: holes[i], seed: seed, idx: i };
        }
      }
      seed++;
    }

    var order = WANT.filter(function (f) { return found[f]; });
    var cur = order[0];
    window.HAZARD_FOUND = order;

    var bar = document.getElementById('bar');
    order.forEach(function (f) {
      var b = document.createElement('button');
      b.textContent = f;
      b.dataset.feature = f;
      b.addEventListener('click', function () { select(f); });
      bar.appendChild(b);
    });
    var vb = document.createElement('button');
    vb.textContent = 'view: overview';
    vb.addEventListener('click', function () {
      view = view === 'overview' ? 'iso' : 'overview';
      vb.textContent = 'view: ' + view;
    });
    bar.appendChild(vb);

    var puttMode = false, puttState = null;
    var pb = document.createElement('button');
    pb.textContent = 'putt read: off';
    pb.addEventListener('click', function () {
      puttMode = !puttMode;
      pb.textContent = 'putt read: ' + (puttMode ? 'on' : 'off');
      pb.classList.toggle('active', puttMode);
      buildPutt();
      fitView(true);
    });
    bar.appendChild(pb);

    function h() { return found[cur].hole; }

    // Fake a putt from the edge of the green to the pin so the slope grid +
    // flowing dots can be inspected without playing a full round.
    function buildPutt() {
      if (!puttMode || !window.Physics) { puttState = null; return; }
      var hole = h();
      var toTee = Math.atan2(hole.tee.x - hole.pin.x, hole.tee.y - hole.pin.y);
      var r = hole.greenR * 0.7;
      var ball = { x: hole.pin.x + Math.sin(toTee) * r, y: hole.pin.y + Math.cos(toTee) * r, lie: 'green' };
      var aim = Math.atan2(hole.pin.x - ball.x, hole.pin.y - ball.y);
      var pw = Math.max(0.2, Math.min(1, Course.dist(ball, hole.pin) * 1.05 / 42));
      var sim = Physics.simulate(hole, ball, { club: 'putter', aim: aim, power: pw, acc: 0 });
      puttState = { ball: ball, aim: { from: ball, path: sim.keys, isPutt: true } };
    }

    function select(f) {
      cur = f;
      Ambient.reset(h());
      renderer.snapCamera && fitView(true);
      Array.prototype.forEach.call(bar.children, function (c) {
        if (c.dataset.feature) c.classList.toggle('active', c.dataset.feature === f);
      });
      var rec = found[cur];
      document.getElementById('label').textContent =
        'feature: ' + f + '   |   par ' + h().par + '   |   islands: ' +
        (h().islands ? h().islands.length : 1) + '   |   seed ' + rec.seed + ' hole ' + (rec.idx + 1);
      buildPutt();
    }

    function fitView(snap) {
      var hole = h();
      if (puttMode) {
        var gr = hole.greenR * 1.7;
        renderer.fitBounds({ minX: hole.green.x - gr, maxX: hole.green.x + gr, minY: hole.green.y - gr, maxY: hole.green.y + gr }, 4);
      } else if (view === 'overview') {
        renderer.fitBounds(hole.bounds, 4);
      } else {
        var aim = Math.atan2(hole.pin.x - hole.tee.x, hole.pin.y - hole.tee.y);
        renderer.fitShot(hole.tee, aim, Math.min(hole.length * 0.8, 260));
      }
      if (snap) renderer.snapCamera();
    }

    var last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      var dt = Math.min(100, now - last); last = now;
      fitView(false);
      renderer.tickCamera(dt);
      var hole = h();
      Ambient.update(dt, hole, renderer);
      var ball = puttMode && puttState
        ? { x: puttState.ball.x, y: puttState.ball.y, lie: 'green', strokes: 0 }
        : { x: hole.tee.x, y: hole.tee.y, lie: 'tee', strokes: 0 };
      renderer.draw({
        hole: hole, time: now,
        balls: { p1: ball },
        aim: puttMode && puttState ? puttState.aim : null,
        myUid: null,
      });
    }

    // debug hook: point a feature button at a specific seed/hole
    window.HAZARD_SET = function (feature, seed, idx) {
      var holes = Course.generate(seed, 9);
      found[feature] = { hole: holes[idx], seed: seed, idx: idx };
      select(feature);
    };

    select(cur);
    fitView(true);
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
